<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>構成型NCOの処理</title>
  <link rel="stylesheet" href="../runtime/figure.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>構成型NCOの処理</h1><span class="slide-studio-step"></span></header>
  <main id="stage" tabindex="0" aria-label="構成型NCOの図。クリックまたは左右の矢印キーで段階を切り替えます。"></main>
  <nav class="controls" aria-label="図の段階">
    <button id="previous" type="button" aria-label="前の段階">←</button>
    <span id="step-status" role="status" aria-live="polite" aria-atomic="true"></span>
    <button id="next" type="button" aria-label="次の段階">→</button>
    <button id="restart" type="button">最初へ</button>
  </nav>
  <script type="module" src="player.mjs"></script>
</body>
</html>
